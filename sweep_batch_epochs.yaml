program: train.py
command:
  - C:\Projects\vgg6-cifar10\.venv\Scripts\python.exe
  - ${program}
  - ${args}
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  optimizer:
    value: nadam
  lr:
    value: 0.01
  batch_size:
    values: [64, 128, 256]
  epochs:
    values: [20, 40, 60]
